<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;background:#000}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
const W=1080,H=1920,c=document.getElementById('c').getContext('2d');
const img=new Image();img.onload=async()=>{await document.fonts.load('900 100px "Inter Display"');
  // zoom tighter on the figure, punchier grade
  c.filter='contrast(1.12) saturate(1.25) brightness(0.98)';
  const z=1.25;c.drawImage(img,540-540/z,1150-1150/z,W/z,H/z,0,0,W,H);c.filter='none';
  // light rays from centre
  c.save();c.globalCompositeOperation='lighter';c.translate(540,1300);
  for(let i=0;i<28;i++){const a=i/28*Math.PI*2+0.05;c.rotate(Math.PI*2/28);const g=c.createLinearGradient(0,0,0,-1300);g.addColorStop(0,'rgba(255,210,150,0.13)');g.addColorStop(1,'rgba(140,200,255,0)');c.fillStyle=g;c.beginPath();c.moveTo(-14,0);c.lineTo(-90,-1300);c.lineTo(90,-1300);c.lineTo(14,0);c.fill();}
  c.restore();
  const v=c.createRadialGradient(540,800,H*0.25,540,800,H*0.72);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,0.85)');c.fillStyle=v;c.fillRect(0,0,W,H);
  // dark bands top/bottom
  let g=c.createLinearGradient(0,0,0,430);g.addColorStop(0,'rgba(0,0,0,0.97)');g.addColorStop(0.7,'rgba(0,0,0,0.85)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,430);
  g=c.createLinearGradient(0,H-430,0,H);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(0.3,'rgba(0,0,0,0.85)');g.addColorStop(1,'rgba(0,0,0,0.97)');c.fillStyle=g;c.fillRect(0,H-430,W,430);
  // title
  const lines=[[['A',0],['POPE',0],['PUT',0],['A',0]],[['CORPSE',0]],[['ON',0],['TRIAL',0]]];
  const sizes=[110,200,150];let y=1430;
  c.textBaseline='middle';c.lineJoin='round';
  lines.forEach((ln,li)=>{const sz=sizes[li];c.font=`900 ${sz}px "Inter Display"`;c.letterSpacing='2px';
    const ws=ln.map(w=>c.measureText(w[0]).width);const sp=sz*0.28;const tot=ws.reduce((a,b)=>a+b,0)+sp*(ln.length-1);
    const fit=Math.min(1,980/tot);c.save();c.translate(W/2,y);c.scale(fit,fit);let x=-tot/2;
    ln.forEach((w,i)=>{c.textAlign='left';c.strokeStyle='#05070a';c.lineWidth=sz*0.2;c.strokeText(w[0],x,0);
      c.fillStyle='#ffffff';c.fillText(w[0],x,0);x+=ws[i]+sp;});
    c.restore();y+=sz*0.5+(sizes[li+1]||0)*0.5+22;});
  window.DONE=true;};
img.src='cover_src.jpg';
</script></body></html>
